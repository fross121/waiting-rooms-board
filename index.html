<title>Waiting Rooms Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #14161c; --panel: #1c1f27; --panel2: #242835; --line: #303543; --line2: #3c4254;
    --text: #dfe2ea; --muted: #8d93a3; --accent: #9ef080; --accent-ink: #0d1a0b;
    --amber: #f0b357; --red: #e0705f; --sel: #7fc4ff;
    --display: "Silkscreen", "IBM Plex Mono", monospace;
    --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden; }
  header, .places { flex: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, .tab:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.on { background: #2a3f2a; border-color: var(--accent); color: var(--accent); }
  button.danger { color: var(--red); }
  button:disabled { opacity: .45; cursor: default; }
  input[type=text], textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 8px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-family: var(--display); font-size: 15px; letter-spacing: .04em; margin: 0; color: var(--accent); text-transform: uppercase; }
  .places { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .places button { font-family: var(--display); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 5px 10px; }
  .places button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  header h1 small { display: block; font-family: var(--body); font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  #boardName { width: 220px; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--accent); } .status.warn { color: var(--amber); } .status.bad { color: var(--red); }
  .spacer { flex: 1; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--left, 236px) 6px minmax(160px, 1fr) 6px var(--right, 320px); gap: 0; }
  .gutter { background: var(--line); cursor: col-resize; touch-action: none; }
  .gutter:hover, .gutter.drag { background: var(--accent); }
  aside, .right { min-width: 0; }
  aside, .right { background: var(--panel); border-right: 1px solid var(--line); padding: 12px; overflow: auto; min-height: 0; height: 100%; overscroll-behavior: contain; }
  .right { border-right: 0; border-left: 1px solid var(--line); }
  section { margin-bottom: 18px; }
  h2 { font-family: var(--display); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .list { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .row.wrap { flex-wrap: wrap; }
  .boardItem { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; background: var(--bg); }
  .boardItem:hover { border-color: var(--line2); }
  .boardItem.active { border-color: var(--accent); }
  .boardItem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .boardItem .by { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .pill { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line2); color: var(--muted); }
  .pill.lock { color: var(--amber); border-color: var(--amber); }
  .layerRow { display: grid; grid-template-columns: 22px 1fr 24px; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
  .layerRow.active { background: var(--panel2); color: var(--accent); }
  .layerRow .eye { width: 22px; height: 22px; padding: 0; border: 0; background: transparent; color: var(--muted); }
  .layerRow .eye.off { text-decoration: line-through; opacity: .5; }
  .layerRow .z { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .tools button { padding: 6px 4px; font-size: 12px; }
  .tools select { background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 4px 6px; font-family: var(--mono); font-size: 12px; }
  .tools button kbd { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .canvasWrap { position: relative; overflow: auto; background: #000; min-height: 0; height: 100%; overscroll-behavior: contain; touch-action: none; }
  #board { display: block; image-rendering: pixelated; cursor: crosshair; position: sticky; top: 0; left: 0; z-index: 1; }
  #spacer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; }
  .coord { position: sticky; left: 0; bottom: 0; z-index: 2; font-family: var(--mono); font-size: 11px; color: var(--muted); background: rgba(20,22,28,.85); padding: 3px 8px; width: max-content; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tab { font-size: 12px; padding: 4px 8px; border: 1px solid var(--line2); border-radius: 4px; background: var(--bg); cursor: pointer; }
  .tab.on { border-color: var(--accent); color: var(--accent); }
  .palWrap { overflow: auto; max-height: 52vh; border: 1px solid var(--line); background: #0d0e12; overscroll-behavior: contain; touch-action: none; }
  #palette { display: block; image-rendering: pixelated; cursor: cell; }
  .stampBox { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  #stampPreview { image-rendering: pixelated; background: #0d0e12; border: 1px solid var(--line); }
  .flags button { min-width: 44px; font-family: var(--mono); }
  .help { font-size: 12px; color: var(--muted); }
  .help li { margin-bottom: 4px; }
  textarea { width: 100%; height: 96px; font-family: var(--mono); font-size: 11px; resize: vertical; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 14px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.5); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) {
    body { overflow: auto; display: block; }
    main { grid-template-columns: 1fr; }
    .gutter { display: none; }
    aside, .right { border: 0; border-bottom: 1px solid var(--line); height: auto; }
    .canvasWrap { height: 70vh; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<header>
  <h1>Waiting Rooms Board</h1>
  <label class="row">Board <input id="boardName" type="text" placeholder="name this board" autocomplete="off"></label>
  <label class="row">By <input id="authorName" type="text" placeholder="your name" size="10" autocomplete="off"></label>
  <span id="status" class="status">loading tiles…</span>
  <span class="spacer"></span>
  <button id="btnNew">New board</button>
  <button id="btnDuplicate" title="Copy this board into a new one">Duplicate</button>
  <button id="btnDelete" class="danger">Delete</button>
</header>

<nav id="places" class="places"></nav>
<main>
  <aside>
    <section>
      <h2>Boards</h2>
      <div id="boards" class="list"></div>
      <p id="cloudNote" hidden></p>
    </section>
    <section>
      <h2>Layers</h2>
      <div id="layers" class="list"></div>
      <label class="row help" style="margin-top:6px"><input id="dimOthers" type="checkbox" checked> dim the other layers</label>
    </section>
    <section>
      <h2>Tools</h2>
      <div class="tools">
        <button id="toolPaint" class="on">Paint<kbd>B</kbd></button>
        <button id="toolErase">Erase<kbd>E</kbd></button>
        <button id="toolPick">Pick<kbd>I</kbd></button>
        <button id="btnUndo">Undo<kbd>Ctrl Z</kbd></button>
        <button id="btnRedo">Redo<kbd>Ctrl Y</kbd></button>
        <label class="row" style="grid-column: span 3; justify-content: space-between">Zoom <select id="zoomSel"></select></label>
        <label class="row" style="grid-column: span 3; justify-content: space-between">Tile sheet <select id="palSel"><option value="0.25">¼</option><option value="0.34">⅓</option><option value="0.5" selected>½</option><option value="0.75">¾</option><option value="1">1×</option><option value="1.5">1½×</option><option value="2">2×</option><option value="3">3×</option></select></label>
      </div>
    </section>
  </aside>

  <div class="gutter" id="gutterL" title="drag to resize"></div>
  <div class="canvasWrap" id="canvasWrap">
    <div id="spacer"></div>
    <canvas id="board" width="10" height="10"></canvas>
    <div class="coord" id="coord">–</div>
  </div>

  <div class="gutter" id="gutterR" title="drag to resize"></div>
  <div class="right">
    <section>
      <h2>Tile sheet</h2>
      <div id="tabs" class="tabs"></div>
      <div class="row wrap" style="margin-bottom:8px">
        <button id="btnAddSheet">Add sheet</button>
        <button id="btnReplaceSheet">Replace this sheet</button>
        <button id="btnSheetsDownload">Download sheets for the game</button>
        <input id="sheetFile" type="file" accept="image/png" hidden>
      </div>
      <div class="palWrap" id="palWrap"><canvas id="palette" width="10" height="10"></canvas></div>
      <div class="stampBox">
        <canvas id="stampPreview" width="64" height="64"></canvas>
        <div>
          <div id="stampInfo" class="help">nothing picked</div>
          <div class="row flags" style="margin-top:6px">
            <button id="flagH" title="mirror left/right (H)">flip H</button>
            <button id="flagV" title="mirror top/bottom (V)">flip V</button>
            <button id="flagT" title="turn on its side (T)">turn</button>
          </div>
        </div>
      </div>
    </section>
    <section>
      <h2>Into the game</h2>
      <div class="row wrap">
        <button id="btnDownload" class="primary">Download for the game</button>
        <button id="btnCopyScene">Copy as scene text</button>
      </div>
    </section>
    <section>
      <details>
        <summary>Import a board</summary>
        <textarea id="importText" placeholder="paste a board here"></textarea>
        <div class="row" style="margin-top:6px"><button id="btnImport">Import as a new board</button></div>
      </details>
    </section>
  </div>
</main>
<div id="toast" class="toast"></div>

<script src="firebase-config.js"></script>
<script src="cloud-firebase.js"></script>
<script src="manifest.js"></script>
<script src="main_board.js"></script>
<script src="tutorial_board.js"></script>
<script>
(() => {
'use strict';
const LAYERS = ['TileMapLayer', 'Decoration', 'Foreground', 'Signs'];
const LAYER_LABEL = {TileMapLayer: 'Base', Decoration: 'Decoration', Foreground: 'Foreground', Signs: 'Signs'};
const LAYER_Z = {TileMapLayer: -1, Decoration: -1, Foreground: 13, Signs: 13};
const SOURCE_LABEL = {0: 'Assets', 1: 'Lights', 2: 'Scaffold', 3: 'Ward lockers', 6: 'Med chest', 7: 'Backpack', 8: 'Lockers', 9: 'Padlocks', 10: 'Old facility'};
const FLIP_H = 4096, FLIP_V = 8192, TRANSPOSE = 16384;
// sheets the game keeps for its own purposes but nobody paints rooms from
const HIDDEN_SOURCES = ['2', '10'];
// sheets where only some cells are for painting: the padlock's shut face -
// the game swaps in its sprung face and the two silhouettes itself
const ONLY_TILES = {'9': [[0, 1]]};
// the board: 8 by 9 slots of 16 by 24 cells; the dealer splits slots between
// columns 16k-2 and 16k-1 and rows 24k-10 and 24k-9
const SLOT_ROWS = 9;
// a board's boxes are 16 cells wide unless it was made wider (24 or 32)
const SLOT_WIDTHS = [16, 24, 32];
const X0 = -1, Y0 = -9, ROWS = 24 * SLOT_ROWS;
function slotW() { return state.cur && state.cur.slotW ? state.cur.slotW : 16; }
function boardCols() { return 8 * slotW() + 1; }
const ZOOMS = [2, 3, 4, 5, 6, 7, 8, 10, 12, 14, 16, 20, 24, 28, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256];
// THE PLACES a level can be: one page of boards each. Add a name here to add a page.
const PLACES = ['Hospital', 'Police station', 'Construction site', 'Military base', "Willbee's", 'School', 'Port', 'Housing', 'Tutorial'];
// the game's own boards, shipped with the page: shown on their page until someone saves a change to them
const BUNDLED = {'main-board': {place: 'Hospital', data: window.MAIN_BOARD}, 'tutorial-board': {place: 'Tutorial', data: window.TUTORIAL_BOARD}};
const MAIN_ID = 'main-board';
const MAIN_PLACE = 'Hospital';

const $ = id => document.getElementById(id);
const els = {
  board: $('board'), wrap: $('canvasWrap'), coord: $('coord'), palette: $('palette'), palWrap: $('palWrap'),
  tabs: $('tabs'), stampPreview: $('stampPreview'), stampInfo: $('stampInfo'), boards: $('boards'), layers: $('layers'),
  status: $('status'), boardName: $('boardName'), authorName: $('authorName'), toast: $('toast'), cloudNote: $('cloudNote'),
  importText: $('importText'), dimOthers: $('dimOthers'),
};
const ctx = els.board.getContext('2d');
const pctx = els.palette.getContext('2d');

// ---------- encoding: the scene's own twelve bytes per cell ----------
function encodeLayer(map) {
  const cells = [...map.entries()];
  const buf = new ArrayBuffer(2 + cells.length * 12);
  const v = new DataView(buf);
  v.setUint16(0, 0, true);
  cells.forEach(([k, t], i) => {
    const [x, y] = k.split(',').map(Number);
    const o = 2 + i * 12;
    v.setInt16(o, x, true); v.setInt16(o + 2, y, true);
    v.setUint16(o + 4, t[0], true); v.setUint16(o + 6, t[1], true); v.setUint16(o + 8, t[2], true); v.setUint16(o + 10, t[3], true);
  });
  let s = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function decodeLayer(b64) {
  const map = new Map();
  if (!b64) return map;
  const s = atob(b64);
  const bytes = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  const v = new DataView(bytes.buffer);
  for (let o = 2; o + 12 <= bytes.length; o += 12) {
    const x = v.getInt16(o, true), y = v.getInt16(o + 2, true);
    map.set(x + ',' + y, [v.getUint16(o + 4, true), v.getUint16(o + 6, true), v.getUint16(o + 8, true), v.getUint16(o + 10, true)]);
  }
  return map;
}
function boardToDoc(b) {
  const layers = {};
  let n = 0;
  for (const L of LAYERS) { layers[L] = encodeLayer(b.layers[L]); n += b.layers[L].size; }
  return {format: 'tawboard/1', name: b.name, author: b.author, place: b.place || PLACES[0], slot_w: b.slotW || 16, layers, cells: n, updatedAt: new Date().toISOString()};
}
function docToBoard(id, d) {
  const b = {id, name: d.name || id, author: d.author || '', place: d.place || (BUNDLED[id] ? BUNDLED[id].place : PLACES[0]), slotW: Number(d.slot_w) || 16, layers: {}, updatedAt: d.updatedAt || ''};
  for (const L of LAYERS) b.layers[L] = decodeLayer(d.layers && d.layers[L]);
  return b;
}
function sceneText(b) {
  const uid = 'uid://' + Array.from({length: 12}, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join('');
  let t = `[gd_scene format=4 uid="${uid}"]\n\n[ext_resource type="TileSet" uid="uid://bfmnfp1yd70b7" path="res://tilesets/facility_tileset.tres" id="1_tileset"]\n\n[node name="Board" type="Node2D"]\n\n`;
  for (const L of LAYERS) {
    t += `[node name="${L}" type="TileMapLayer" parent="."]\nz_index = ${LAYER_Z[L]}\ntile_map_data = PackedByteArray("${encodeLayer(b.layers[L])}")\ntile_set = ExtResource("1_tileset")\n\n`;
  }
  for (let i = 0; i < 8 * SLOT_ROWS; i++) {
    t += `[node name="Room${i + 1}" type="Marker2D" parent="."]\nposition = Vector2(${(i % 8) * (b.slotW || 16) * 64}, ${-448 + Math.floor(i / 8) * 1536})\n\n`;
  }
  return t;
}
function parseImport(text) {
  text = text.trim();
  if (text.startsWith('{')) {
    const d = JSON.parse(text);
    if (!d.layers) throw new Error('that JSON has no layers');
    return {name: d.name || 'Imported board', layers: d.layers, slotW: Number(d.slot_w) || 16};
  }
  const layers = {};
  const re = /\[node name="(\w+)" type="TileMapLayer"[^\]]*\][^\[]*?tile_map_data = PackedByteArray\("([^"]*)"\)/g;
  let m, any = false;
  while ((m = re.exec(text))) { if (LAYERS.includes(m[1])) { layers[m[1]] = m[2]; any = true; } }
  if (!any) throw new Error('no board layers found in that text');
  const nm = /\[node name="(\w+)" type="Node2D"\]/.exec(text);
  return {name: nm ? nm[1] : 'Imported board', layers};
}

// ---------- state ----------
const state = {
  boards: new Map(),           // id -> {name, author, updatedAt, cells, lease?}
  cur: null,                   // the open board (working copy)
  readOnly: false,
  layer: 'TileMapLayer', hidden: new Set(), tool: 'paint', zoom: 8,
  place: PLACES[0],
  stamp: null,                 // {cells: [[dx,dy,src,ax,ay]], w, h, src}
  flags: 0, source: '0',
  undo: [], redo: [], stroke: null,
  hover: null, dirty: false, saveTimer: 0,
};
const holder = (() => { try { return localStorage.getItem('taw_holder') || (localStorage.setItem('taw_holder', 'h' + Math.random().toString(36).slice(2)), localStorage.getItem('taw_holder')); } catch (e) { return 'h' + Math.random().toString(36).slice(2); } })();
try { els.authorName.value = localStorage.getItem('taw_author') || ''; } catch (e) {}
els.authorName.addEventListener('change', () => { try { localStorage.setItem('taw_author', els.authorName.value.trim()); } catch (e) {} if (state.cur && !state.readOnly) { state.cur.author = els.authorName.value.trim(); markDirty(); } });

// ---------- images ----------
const images = {};
const tileSet = {};
let sourceIds = Object.keys(TILESET.sources);
function sourceName(sid) { const s = TILESET.sources[sid]; return (s && s.name) || SOURCE_LABEL[sid] || ('Sheet ' + sid); }
function loadSource(sid, onDone) {
  const s = TILESET.sources[sid];
  tileSet[sid] = new Set((ONLY_TILES[sid] || s.tiles).map(t => t[0] + ',' + t[1]));
  const img = new Image();
  img.onload = () => { render(); renderPalette(); if (onDone) onDone(true); };
  img.onerror = () => { setStatus('a tile sheet failed to load', 'bad'); if (onDone) onDone(false); };
  img.src = s.png ? 'data:image/png;base64,' + s.png : s.file;
  images[sid] = img;
}
let loaded = 0;
for (const sid of sourceIds) loadSource(sid, () => { loaded++; if (loaded === sourceIds.length) setStatus('tiles ready', ''); });

// ---------- the artist's sheets: add a new one, or replace one in place ----------
// A sheet is cut into cells of one size; every cell with any paint in it is a
// tile. New sheets take the next free source id (never the game's own 0-10,
// nor 40, which the game bakes into).
function nextSourceId() { let id = 11; while (TILESET.sources[String(id)] || id === 40) id++; return String(id); }
function fileToImage(file) {
  return new Promise((ok, bad) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => ok({img, b64: String(r.result).split(',')[1]}); img.onerror = () => bad(new Error('not a readable PNG')); img.src = String(r.result); };
    r.onerror = () => bad(new Error('could not read the file')); r.readAsDataURL(file);
  });
}
function scanTiles(img, rw, rh) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  const tiles = [];
  for (let ty = 0; ty * rh + rh <= c.height; ty++) for (let tx = 0; tx * rw + rw <= c.width; tx++) {
    let any = false;
    for (let y = ty * rh; y < ty * rh + rh && !any; y++) for (let px = tx * rw; px < tx * rw + rw; px++) if (d[(y * c.width + px) * 4 + 3] > 0) { any = true; break; }
    if (any) tiles.push([tx, ty]);
  }
  return tiles;
}
async function installSheet(sid, meta, b64, persist) {
  TILESET.sources[sid] = Object.assign({}, TILESET.sources[sid] || {}, meta, {png: b64, custom: true});
  if (!sourceIds.includes(sid)) sourceIds.push(sid);
  await new Promise(ok => loadSource(sid, ok));
  buildTabs(); renderPalette(); render();
  if (persist) {
    try { await store.saveSheet(sid, TILESET.sources[sid]); setStatus((store.cloud ? 'sheet saved to the cloud' : 'sheet saved in this browser'), 'ok'); }
    catch (e) { setStatus('could not save the sheet: ' + ((e && e.message) || 'too big?'), 'bad'); }
  }
}
let sheetMode = 'add';
$('btnAddSheet').addEventListener('click', () => { sheetMode = 'add'; $('sheetFile').value = ''; $('sheetFile').click(); });
$('btnReplaceSheet').addEventListener('click', () => { sheetMode = 'replace'; $('sheetFile').value = ''; $('sheetFile').click(); });
$('sheetFile').addEventListener('change', async () => {
  const f = $('sheetFile').files[0]; if (!f) return;
  let loadedImg;
  try { loadedImg = await fileToImage(f); } catch (e) { toast(e.message); return; }
  const {img, b64} = loadedImg;
  if (sheetMode === 'add') {
    const name = prompt('Name the sheet', f.name.replace(/\.png$/i, ''));
    if (!name) return;
    const size = Number(prompt('Cell size in pixels (64 for the game\'s tiles)', '64'));

  clearTimeout(state.saveTimer); state.dirty = false;
  await deleteDoc(id);
  state.boards.delete(id); state.cur = null; releaseLease();
  els.boardName.value = ''; renderBoards(); renderLayers(); render(); setStatus('deleted', '');
  if (BUNDLED[id]) { state.boards.set(id, {name: BUNDLED[id].data.name, author: BUNDLED[id].data.author, place: BUNDLED[id].place, updatedAt: ''}); openBoard(id); }
});

function markDirty() {
  if (!state.cur || state.readOnly) return;
  state.dirty = true; setStatus('unsaved changes', 'warn');
  clearTimeout(state.saveTimer); state.saveTimer = setTimeout(saveNow, 1500);
  renderLayers();
}
async function flushSave() { clearTimeout(state.saveTimer); if (state.dirty) await saveNow(); }
async function saveNow() {
  if (!state.cur || state.readOnly) return;
  state.dirty = false;
  const doc = boardToDoc(state.cur);
  state.boards.set(state.cur.id, {...(state.boards.get(state.cur.id) || {}), name: doc.name, author: doc.author, place: doc.place, slotW: doc.slot_w, updatedAt: doc.updatedAt, cells: doc.cells});
  try {
    setStatus('saving…', '');
    await storeDoc(state.cur.id, doc);
    setStatus((store.cloud ? 'saved to the cloud ' : 'saved in this browser ') + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}), 'ok');
    $('btnDelete').disabled = false;
  } catch (e) {
    state.dirty = true;
    setStatus('could not save: ' + (e && e.code === 'quota_exceeded' ? 'the store is full - delete an old board' : (e && e.message) || 'try again'), 'bad');
  }
  renderBoards();
}

// ---------- storage ----------
// The page talks to a STORE: list(onChange) delivers every saved board
// (again whenever one changes), load/save/remove move whole boards,
// lease/release keep one editor per board, download hands a file over.
// The default keeps boards in this browser. A host page may define
// window.BOARD_STORE_FACTORY before this script to supply a shared one.
const LS_KEY = 'taw_boards_v1';
function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; } }
function lsWrite(all) { try { localStorage.setItem(LS_KEY, JSON.stringify(all)); } catch (e) { throw new Error('this browser refused to store it'); } }
const localStore = {
  cloud: false, restoreId: null,
  list(onChange) { onChange(Object.entries(lsRead()).map(([id, d]) => ({id, data: d, pending: false}))); this._onChange = onChange; },
  _notify() { if (this._onChange) this.list(this._onChange); },
  async load(id) { return lsRead()[id] || null; },
  async save(id, doc) { const all = lsRead(); all[id] = doc; lsWrite(all); this._notify(); },
  async remove(id) { const all = lsRead(); delete all[id]; lsWrite(all); this._notify(); },
  async lease() { return true; }, release() {},
  async listSheets() {
    let all = {}; try { all = JSON.parse(localStorage.getItem('taw_sheets_v1') || '{}'); } catch (e) {}
    return Object.entries(all).map(([id, v]) => ({id, meta: v.meta, png: v.png}));
  },
  async saveSheet(sid, src) {
    let all = {}; try { all = JSON.parse(localStorage.getItem('taw_sheets_v1') || '{}'); } catch (e) {}
    all[sid] = {meta: {name: src.name, region: src.region, tiles: src.tiles, width: src.width, height: src.height}, png: src.png};
    try { localStorage.setItem('taw_sheets_v1', JSON.stringify(all)); } catch (e) { throw new Error('this browser has no room for it'); }
  },
  async download(filename, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'})); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return 'downloading ' + filename + ' - drop it into boards/';
  },
};
let store = localStore;
async function loadDoc(id) { return store.load(id); }
async function storeDoc(id, doc) { return store.save(id, doc); }
async function deleteDoc(id) { return store.remove(id); }
async function takeLease(id) { try { return await store.lease(id, holder, () => toast('lost the lock on this board')); } catch (e) { return true; } }
function releaseLease() { store.release(); }
function onStoreChange(docs) {
  const seen = new Set();
  for (const d of docs) {
    const m = d.data || {};
    seen.add(d.id);
    state.boards.set(d.id, {...(state.boards.get(d.id) || {}), name: m.name, author: m.author, place: m.place, slotW: Number(m.slot_w) || 16, updatedAt: m.updatedAt, cells: m.cells});
    // another editor's live changes to the board we are only reading
    if (state.cur && state.cur.id === d.id && state.readOnly && !d.pending) {
      const b = docToBoard(d.id, m); state.cur.layers = b.layers; state.cur.name = b.name; els.boardName.value = b.name; render(); renderLayers();
    }
  }
  for (const id of [...state.boards.keys()]) if (!BUNDLED[id] && !seen.has(id)) state.boards.delete(id);
  for (const id in BUNDLED) if (!seen.has(id)) state.boards.set(id, {name: BUNDLED[id].data.name, author: BUNDLED[id].data.author, place: BUNDLED[id].place, updatedAt: ''});
  renderBoards();
}

// ---------- export / import ----------
$('btnDownload').addEventListener('click', async () => {
  if (!state.cur) return;
  const doc = boardToDoc(state.cur);
  const text = JSON.stringify(doc);
  const filename = ((state.cur.place + ' ' + state.cur.name).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'board') + '.json';
  try { toast(await store.download(filename, text)); }
  catch (e) {
    if (e && e.code === 'declined') return;
    try { await navigator.clipboard.writeText(text); toast('could not save a file here - the board text is on your clipboard; save it as ' + filename); }
    catch (e2) { els.importText.value = text; toast('could not save a file here - the board text is in the import box; save it as ' + filename); }
  }
});
$('btnCopyScene').addEventListener('click', async () => {
  if (!state.cur) return;
  const t = sceneText(state.cur);
  try { await navigator.clipboard.writeText(t); toast('scene text copied - paste it into boards/yourname.tscn'); }
  catch (e) { els.importText.value = t; toast('the scene text is in the import box - copy it from there'); }
});
$('btnImport').addEventListener('click', async () => {
  let parsed;
  try { parsed = parseImport(els.importText.value); } catch (e) { toast(e.message); return; }
  const b = blankBoard('tmp', parsed.name, els.authorName.value.trim(), parsed.slotW || 16);
  for (const L of LAYERS) b.layers[L] = decodeLayer(parsed.layers[L]);
  await newBoard(b);
  els.importText.value = '';
});

// ---------- tools, flags, keys, zoom ----------
$('toolPaint').addEventListener('click', () => { state.tool = 'paint'; syncTools(); });
$('toolErase').addEventListener('click', () => { state.tool = 'erase'; syncTools(); });
$('toolPick').addEventListener('click', () => { state.tool = 'pick'; syncTools(); });
$('btnUndo').addEventListener('click', undo); $('btnRedo').addEventListener('click', redo);
$('flagH').addEventListener('click', () => { state.flags ^= FLIP_H; syncFlags(); updateStampInfo(); render(); });
$('flagV').addEventListener('click', () => { state.flags ^= FLIP_V; syncFlags(); updateStampInfo(); render(); });
$('flagT').addEventListener('click', () => { state.flags ^= TRANSPOSE; syncFlags(); updateStampInfo(); render(); });
// Zoom keeping the board point under (px, py) - view pixels - where it is;
// with no point given, the middle of the view.
function setZoomAt(z, px, py) {
  z = Math.max(ZOOMS[0], Math.min(ZOOMS[ZOOMS.length - 1], Math.round(z)));
  if (z === state.zoom) return;
  const [ox, oy] = viewOrigin();
  if (px === undefined) { px = els.board.width / 2; py = els.board.height / 2; }
  const cx = (ox + px) / state.zoom, cy = (oy + py) / state.zoom;
  state.zoom = z;
  const sel = $('zoomSel');
  sel.value = String(ZOOMS.includes(z) ? z : ZOOMS.reduce((a, b) => Math.abs(b - z) < Math.abs(a - z) ? b : a));
  paintBoard();
  els.wrap.scrollLeft = cx * z - px; els.wrap.scrollTop = cy * z - py;
  render();
}
function setZoom(z) { setZoomAt(z); }
// a pinch on a trackpad arrives as a wheel with ctrlKey (Chrome, Firefox)
// or as gesture events (Safari); either zooms the panel it happens over
els.wrap.addEventListener('wheel', ev => {
  if (!(ev.ctrlKey || ev.metaKey)) return;  // a plain wheel scrolls the panel
  ev.preventDefault();
  const r = els.board.getBoundingClientRect();
  setZoomAt(state.zoom * Math.exp(-ev.deltaY * 0.01), ev.clientX - r.left, ev.clientY - r.top);
}, {passive: false});
let gestureBase = 0;
els.wrap.addEventListener('gesturestart', ev => { ev.preventDefault(); gestureBase = state.zoom; });
els.wrap.addEventListener('gesturechange', ev => {
  ev.preventDefault();
  const r = els.board.getBoundingClientRect();
  setZoomAt(gestureBase * ev.scale, ev.clientX - r.left, ev.clientY - r.top);
});
els.wrap.addEventListener('gestureend', ev => ev.preventDefault());
function setPalScale(sc, px, py) {
  sc = Math.max(0.25, Math.min(4, sc));
  const w = els.palWrap;
  const fx = (w.scrollLeft + (px === undefined ? w.clientWidth / 2 : px)) / PAL_SCALE;
  const fy = (w.scrollTop + (py === undefined ? w.clientHeight / 2 : py)) / PAL_SCALE;
  PAL_SCALE = sc;
  const opts = [...$('palSel').options].map(o => Number(o.value));
  $('palSel').value = String(opts.reduce((a, b) => Math.abs(b - sc) < Math.abs(a - sc) ? b : a));
  renderPalette();
  w.scrollLeft = fx * sc - (px === undefined ? w.clientWidth / 2 : px);
  w.scrollTop = fy * sc - (py === undefined ? w.clientHeight / 2 : py);
}
els.palWrap.addEventListener('wheel', ev => {
  if (!(ev.ctrlKey || ev.metaKey)) return;
  ev.preventDefault();
  const r = els.palWrap.getBoundingClientRect();
  setPalScale(PAL_SCALE * Math.exp(-ev.deltaY * 0.01), ev.clientX - r.left, ev.clientY - r.top);
}, {passive: false});
let palGestureBase = 0;
els.palWrap.addEventListener('gesturestart', ev => { ev.preventDefault(); palGestureBase = PAL_SCALE; });
els.palWrap.addEventListener('gesturechange', ev => { ev.preventDefault(); const r = els.palWrap.getBoundingClientRect(); setPalScale(palGestureBase * ev.scale, ev.clientX - r.left, ev.clientY - r.top); });
els.palWrap.addEventListener('gestureend', ev => ev.preventDefault());
for (const z of ZOOMS) { const o = document.createElement('option'); o.value = z; o.textContent = z + ' px per cell'; if (z === state.zoom) o.selected = true; $('zoomSel').appendChild(o); }
$('zoomSel').addEventListener('change', () => setZoom(Number($('zoomSel').value)));
$('palSel').addEventListener('change', () => setPalScale(Number($('palSel').value)));
els.dimOthers.addEventListener('change', render);
els.wrap.addEventListener('scroll', render);
// the side panels: drag the handles; double-click one to put it back
(() => {
  const mainEl = document.querySelector('main');
  const saved = (() => { try { return JSON.parse(localStorage.getItem('taw_panels') || '{}'); } catch (e) { return {}; } })();
  const widths = {left: saved.left || 236, right: saved.right || 320};
  function apply() {
    mainEl.style.setProperty('--left', widths.left + 'px'); mainEl.style.setProperty('--right', widths.right + 'px');
    try { localStorage.setItem('taw_panels', JSON.stringify(widths)); } catch (e) {}
    render();
  }
  function hook(id, side) {
    const g = $(id);
    g.addEventListener('pointerdown', ev => {
      ev.preventDefault(); g.classList.add('drag'); g.setPointerCapture(ev.pointerId);
      const move = e => {
        const r = mainEl.getBoundingClientRect();
        const max = Math.max(40, r.width - (side === 'left' ? widths.right : widths.left) - 200);
        widths[side] = Math.round(Math.min(max, Math.max(40, side === 'left' ? e.clientX - r.left - 3 : r.right - e.clientX - 3)));
        apply();
      };
      const up = () => { g.classList.remove('drag'); g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up); };
      g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
    });
    g.addEventListener('dblclick', () => { widths[side] = side === 'left' ? 236 : 320; apply(); });
  }
  hook('gutterL', 'left'); hook('gutterR', 'right');
  apply();
})();
window.addEventListener('resize', render);
window.addEventListener('keydown', ev => {
  if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA')) return;
  const k = ev.key.toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && k === 'z') { ev.preventDefault(); if (ev.shiftKey) redo(); else undo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && k === 'y') { ev.preventDefault(); redo(); return; }
  if (ev.ctrlKey || ev.metaKey) return;
  if (k === 'b') { state.tool = 'paint'; syncTools(); }
  else if (k === 'e') { state.tool = 'erase'; syncTools(); }
  else if (k === 'i') { state.tool = 'pick'; syncTools(); }
  else if (k === 'h') { state.flags ^= FLIP_H; syncFlags(); updateStampInfo(); render(); }
  else if (k === 'v') { state.flags ^= FLIP_V; syncFlags(); updateStampInfo(); render(); }
  else if (k === 't') { state.flags ^= TRANSPOSE; syncFlags(); updateStampInfo(); render(); }
  else if (k >= '1' && k <= '4') { state.layer = LAYERS[Number(k) - 1]; renderLayers(); render(); }
  else if (k === '=' || k === '+') setZoom(ZOOMS[Math.min(ZOOMS.length - 1, ZOOMS.indexOf(state.zoom) + 1)]);
  else if (k === '-') setZoom(ZOOMS[Math.max(0, ZOOMS.indexOf(state.zoom) - 1)]);
  else return;
  ev.preventDefault();
});
window.addEventListener('beforeunload', ev => { if (state.dirty) { flushSave(); ev.preventDefault(); ev.returnValue = ''; } });

// ---------- boot ----------
function placeBoards(pl) {
  return [...state.boards.entries()].filter(([id, m]) => (m.place || (BUNDLED[id] ? BUNDLED[id].place : PLACES[0])) === pl)
    .sort((a, b) => (BUNDLED[a[0]] ? -1 : BUNDLED[b[0]] ? 1 : (b[1].updatedAt || '').localeCompare(a[1].updatedAt || '')));
}
// A page shows its own boards only: its first board, or an empty one that
// is saved the moment something is painted on it.
async function openPlace(pl) {
  const mine = placeBoards(pl);
  if (mine.length) return openBoard(mine[0][0]);
  await flushSave(); releaseLease();
  const b = blankBoard(slug(pl), pl, els.authorName.value.trim() || 'someone');
  b.place = pl;
  state.cur = b; state.readOnly = false; state.undo = []; state.redo = []; state.dirty = false;
  els.boardName.value = b.name; els.boardName.disabled = false; $('btnDelete').disabled = true;
  setStatus('empty', '');
  renderBoards(); renderLayers(); render();
}
function renderPlaces() {
  const nav = $('places'); nav.innerHTML = '';
  for (const pl of PLACES) {
    const b = document.createElement('button'); b.textContent = pl; b.className = pl === state.place ? 'on' : '';
    b.addEventListener('click', () => { state.place = pl; renderPlaces(); openPlace(pl); });
    nav.appendChild(b);
  }
}
buildTabs(); renderLayers(); syncTools(); syncFlags(); updateStampInfo(); renderPlaces();
for (const id in BUNDLED) state.boards.set(id, {name: BUNDLED[id].data.name, author: BUNDLED[id].data.author, place: BUNDLED[id].place, updatedAt: ''});
renderBoards();
window.BOARD_CURRENT_ID = () => (state.cur ? state.cur.id : null);
(async () => {
  if (window.BOARD_STORE_FACTORY) {
    try { const s = await window.BOARD_STORE_FACTORY(); if (s) store = s; } catch (e) {}
  }
  els.cloudNote.hidden = !!store.cloud;
  store.list(onStoreChange, e => setStatus('the board list is unavailable (' + ((e && e.code) || 'error') + ')', 'bad'));
  await loadCustomSheets();
  const restore = store.restoreId;
  if (restore && restore !== MAIN_ID) openBoard(restore);
  else openBoard(MAIN_ID);
})();
})();
</script>
