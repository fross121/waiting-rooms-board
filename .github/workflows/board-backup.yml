name: Board backup

on:
  schedule:
    - cron: "17 */4 * * *"   # every four hours
  workflow_dispatch:         # ...and on demand from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the shared boards and sheets
        run: python3 backup.py
      - name: Commit what changed
        run: |
          git config user.name "board-backup"
          git config user.email "board-backup@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "Board backup $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
